<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,700;1,700&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/CSS/global.css">
    <link rel="stylesheet" href="../assets/CSS/login.css">

    <title>SmileSync</title>
</head>

<body>
    <header class="content">
        <img src="assets/icons/logo.svg" alt="Logo so SmileSync">
        <h2>Smile<span>Sync</span></h2>
    </header>

    <div class="login-wrapper">
        <main class="login-page">

            <h1>Bem-vindo</h1>

            <form id="login-form">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@clinica.com.br" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn">Entrar <img src="assets/icons/arrow.svg"
                        alt="Seta apontando para a direita"></button>

            </form>
        </main>
    </div>
</body>
</html>
